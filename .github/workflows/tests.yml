name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Tests (PHP 8.5 / Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Throwaway key for the public test suite only; never used outside CI.
      APP_KEY: 'base64:FVwm6akkmHA2gCMM23avhg4D3XXXsjedD4+riCdCIl0='
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, gd, curl, openssl, tokenizer, xml, sqlite3, pdo_sqlite
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  mariadb-migrations:
    name: Migrations on MariaDB 10.6 (production engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: eagle_ci
          MARIADB_USER: eagle_ci
          MARIADB_PASSWORD: eagle_ci
          MARIADB_ROOT_PASSWORD: eagle_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Throwaway key for CI only; never used outside CI.
      APP_KEY: 'base64:FVwm6akkmHA2gCMM23avhg4D3XXXsjedD4+riCdCIl0='
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eagle_ci
      DB_USERNAME: eagle_ci
      DB_PASSWORD: eagle_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run all migrations
        run: php artisan migrate --force

      - name: Seed production data twice (must be idempotent)
        run: |
          php artisan db:seed --class=ProductionSeeder --force
          php artisan db:seed --class=ProductionSeeder --force

      - name: Roll back and migrate again
        run: |
          php artisan migrate:rollback --force
          php artisan migrate --force
